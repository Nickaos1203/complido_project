name: CI - Complido

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
jobs:

  # ==========================================================
  # 1. PRÉPARATION DE L'ENVIRONNEMENT
  # 2. BASE DE DONNÉES DE TEST
  # 3. EXÉCUTION DES TESTS
  # ==========================================================

  tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Complido

    # Base de données PostgreSQL de test
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: complido_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ------------------------------------------------------
      # ÉTAPE 1 : Préparation de l'environnement
      # ------------------------------------------------------

      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configuration des variables d'environnement
        run: |
          echo "DB_NAME=complido_test" >> $GITHUB_ENV
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV

      # ------------------------------------------------------
      # ÉTAPE 2 : Base de données de test
      # ------------------------------------------------------

      - name: Vérification de Django
        run: |
          python manage.py check

      - name: Vérification des migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Application des migrations
        run: |
          python manage.py migrate

      # ------------------------------------------------------
      # ÉTAPE 3 : Exécution des tests
      # ------------------------------------------------------

      - name: Exécution des tests
        run: |
          pytest -v --cov=. --cov-report=term-missing


  # ==========================================================
  # 4. CONTENEURISATION
  # ==========================================================

  docker:

    needs: tests

    runs-on: ubuntu-latest

    # La conteneurisation est effectuée uniquement
    # lorsqu'une modification arrive sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Construction des conteneurs
        run: |
          docker compose build

      - name: Démarrage des conteneurs
        run: |
          docker compose up -d

      - name: Vérification des conteneurs
        run: |
          docker compose ps

      - name: Arrêt des conteneurs
        if: always()
        run: |
          docker compose down


  # ==========================================================
  # 5. INTÉGRATION SUR MAIN
  # ==========================================================

  # L'intégration sur main est réalisée par la Pull Request.
  # Les tests doivent être validés avant le merge.