name: CI - Complido

# ============================================================
# DÉCLENCHEMENT DU PIPELINE
# ============================================================

on:

  # Déclenchement lors d'un push sur main
  push:
    branches:
      - main

  # Déclenchement lors d'une Pull Request vers main
  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # 2.1. PRÉPARATION DE L'ENVIRONNEMENT
  # 2.2. BASE DE DONNÉES DE TEST
  # 2.3. EXÉCUTION DES TESTS
  # ==========================================================

  tests:

    name: Tests Django

    runs-on: ubuntu-latest

    # ========================================================
    # 2.2. BASE DE DONNÉES POSTGRESQL DE TEST
    # ========================================================

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: complido_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d complido_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ======================================================
      # 2.1. PRÉPARATION DE L'ENVIRONNEMENT
      # ======================================================

      - name: Récupération du projet
        uses: actions/checkout@v4


      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Configuration des variables d'environnement
        run: |
          echo "DB_NAME=complido_test" >> $GITHUB_ENV
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV


      # ======================================================
      # 2.2. MISE EN PLACE DE LA BASE DE DONNÉES DE TEST
      # ======================================================

      - name: Vérification de Django
        working-directory: Complido
        run: |
          python manage.py check


      - name: Vérification des migrations
        working-directory: Complido
        run: |
          python manage.py makemigrations --check --dry-run


      - name: Application des migrations
        working-directory: Complido
        run: |
          python manage.py migrate


      # ======================================================
      # 2.3. EXÉCUTION DES TESTS AUTOMATISÉS
      # ======================================================

      - name: Exécution des tests Pytest
        working-directory: Complido
        run: |
          pytest -v --cov=. --cov-report=term-missing


  # ==========================================================
  # 2.4. CONTENEURISATION
  # ==========================================================

  docker:

    name: Conteneurisation

    # La conteneurisation est réalisée uniquement
    # si les tests sont réussis.
    needs: tests

    runs-on: ubuntu-latest

    # La conteneurisation est effectuée uniquement
    # après un push sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # Récupération du projet
      # ------------------------------------------------------

      - name: Récupération du projet
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Vérification de Docker Compose
      # ------------------------------------------------------

      - name: Vérification de Docker Compose
        run: |
          docker compose version


      # ------------------------------------------------------
      # Vérification de la configuration Docker
      # ------------------------------------------------------

      - name: Vérification de la configuration Docker
        run: |
          docker compose config


      # ------------------------------------------------------
      # Construction des conteneurs
      # ------------------------------------------------------

      - name: Construction des conteneurs
        run: |
          docker compose build


      # ------------------------------------------------------
      # Démarrage des conteneurs
      # ------------------------------------------------------

      - name: Démarrage des conteneurs
        run: |
          docker compose up -d


      # ------------------------------------------------------
      # Vérification des conteneurs
      # ------------------------------------------------------

      - name: Vérification des conteneurs
        run: |
          docker compose ps


      # ------------------------------------------------------
      # Affichage des logs
      # ------------------------------------------------------

      - name: Affichage des logs
        if: always()
        run: |
          docker compose logs


      # ------------------------------------------------------
      # Arrêt des conteneurs
      # ------------------------------------------------------

      - name: Arrêt des conteneurs
        if: always()
        run: |
          docker compose down