<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            {% endblock %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>


    <body class="bg-light">

        <header class="position-fixed top-0 start-0 w-100 bg-white border-bottom" style="height: 56px; z-index: 1040;">
            {% include "components/header.html" %}
        </header>

        <div class="d-flex" style="padding-top: 56px;">

            <aside id="sidebar" class="position-fixed start-0 d-flex flex-column vh-100" style=" top: 56px; width: 220px; background-color: #062b52; z-index: 1030;">
                {% include "components/sidebar.html" %}
            </aside>

            <main class="flex-grow-1" style="margin-left: 220px; min-width: 0;">

                <div class="p-4">
                    {% block content %}{% endblock %}
                </div>

                    {% include 'components/footer.html' %}
                    
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    </body>
</html>
