<nav
    class="navbar navbar-expand-lg bg-white border-bottom px-4"
    style="min-height: 70px;"
>

    <div class="container-fluid px-0">

        <!-- Bouton mobile -->
        <button
            class="btn btn-outline-secondary d-lg-none me-3"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobileSidebar"
        >
            <i class="bi bi-list"></i>
        </button>


        <!-- Titre -->
        <div>

            <h1 class="h5 mb-0 fw-semibold">
                {% block page_title %}
                    Tableau de bord
                {% endblock %}
            </h1>

        </div>


        <!-- Partie droite -->
        <div class="d-flex align-items-center gap-3 ms-auto">


            <!-- Recherche -->
            <form
                class="d-none d-md-flex"
                role="search"
            >

                <div class="input-group">

                    <span class="input-group-text bg-light border-end-0">

                        <i class="bi bi-search text-muted"></i>

                    </span>

                    <input
                        type="search"
                        class="form-control bg-light border-start-0"
                        placeholder="Rechercher..."
                        aria-label="Rechercher"
                    >

                </div>

            </form>


            <!-- Notifications -->
            <button
                type="button"
                class="btn btn-light position-relative"
                title="Notifications"
            >

                <i class="bi bi-bell fs-5"></i>

                <span
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                >
                    2

                    <span class="visually-hidden">
                        notifications non lues
                    </span>

                </span>

            </button>


            <!-- Séparateur -->
            <div class="vr d-none d-md-block"></div>


            <!-- Utilisateur -->
            <div class="dropdown">

                <button
                    class="btn btn-light dropdown-toggle d-flex align-items-center"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >

                    <div
                        class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2"
                        style="width: 38px; height: 38px;"
                    >

                        <i class="bi bi-person"></i>

                    </div>

                    <div class="d-none d-md-block text-start">

                        <div class="fw-semibold">
                            {{ user.get_full_name|default:user.username }}
                        </div>

                        <small class="text-muted">
                            {{ user.get_role_display }}
                        </small>

                    </div>

                </button>


                <ul class="dropdown-menu dropdown-menu-end shadow-sm">

                    <!-- Profil -->
                    <li>

                        <a
                            class="dropdown-item"
                            href="{% url 'users:profile' %}"
                        >

                            <i class="bi bi-person me-2"></i>

                            Mon profil

                        </a>

                    </li>


                    <!-- Modifier -->
                    <li>

                        <a
                            class="dropdown-item"
                            href="{% url 'users:profile_update' %}"
                        >

                            <i class="bi bi-pencil me-2"></i>

                            Modifier mon profil

                        </a>

                    </li>


                    <li>
                        <hr class="dropdown-divider">
                    </li>


                    <!-- Déconnexion -->
                    <li>

                        <form
                            method="post"
                            action="{% url 'users:logout' %}"
                        >

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="dropdown-item text-danger"
                            >

                                <i class="bi bi-box-arrow-right me-2"></i>

                                Se déconnecter

                            </button>

                        </form>

                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>
