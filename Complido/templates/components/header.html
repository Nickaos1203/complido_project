{% load static %}

<div class="container-fluid h-100 px-3 bg-black">

    <div class="d-flex align-items-center h-100">

        <!-- ================================= -->
        <!-- LOGO                              -->
        <!-- ================================= -->

        <a
        {% comment %} {% url 'homepage' %} {% endcomment %}
            href=""
            class="d-flex align-items-center text-decoration-none"
        >
            <img
                src="{% static 'pictures/00_logo_complido_header.png' %}"
                alt="Complido"
                style="
                    width: 125px;
                    height: auto;
                    max-height: 42px;
                    object-fit: contain;
                "
            >
        </a>


        <div class="flex-grow-1"></div>


        {% if user.is_authenticated %}

            <!-- ================================= -->
            <!-- RECHERCHE                          -->
            <!-- ================================= -->

            <div
                class="input-group input-group-sm me-4"
                style="width: 230px;"
            >

                <input
                    type="search"
                    class="form-control"
                    placeholder="Rechercher..."
                >

            </div>


            <!-- ================================= -->
            <!-- NOTIFICATIONS                      -->
            <!-- ================================= -->

            <button
                type="button"
                class="btn btn-link text-white
                       border-0 position-relative me-3"
            >

                <i class="bi bi-bell"></i>

                <span
                    class="position-absolute top-0 start-100
                           translate-middle badge rounded-pill
                           bg-danger"
                    style="font-size: 7px;"
                >
                    3
                </span>

            </button>


            <!-- ================================= -->
            <!-- UTILISATEUR                        -->
            <!-- ================================= -->

            <div class="dropdown">

                <button
                    type="button"
                    class="btn btn-link text-white
                           text-decoration-none p-0
                           d-flex align-items-center"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >

                    <!-- Avatar / initiales -->

                    <span
                        class="rounded-circle bg-secondary
                               text-white d-flex
                               align-items-center
                               justify-content-center me-2"
                        style="
                            width: 30px;
                            height: 30px;
                            font-size: 10px;
                        "
                    >
                        {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
                    </span>


                    <!-- Nom -->

                    <span class="small fw-semibold">
                        {{ user.get_full_name|default:user.username }}
                    </span>


                    <i
                        class="bi bi-chevron-down ms-2"
                        style="font-size: 9px;"
                    ></i>

                </button>


                <!-- MENU UTILISATEUR -->

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                        >
                            <i class="bi bi-person me-2"></i>
                            Mon profil
                        </a>
                    </li>


                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                        >
                            <i class="bi bi-gear me-2"></i>
                            Paramètres
                        </a>
                    </li>


                    <li>
                        <hr class="dropdown-divider">
                    </li>


                    <!-- DÉCONNEXION -->

                    <li>
                        <form method="post" action="{% url 'users:logout' %}" class="m-0">
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="dropdown-item text-danger"
                            >
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Déconnexion
                            </button>
                        </form>
                    </li>

                </ul>

            </div>


        {% else %}

            <!-- ================================= -->
            <!-- FORMULAIRE DE CONNEXION            -->
            <!-- ================================= -->

            <form
                method="post"
                action="{% url 'users:login' %}"
                class="d-flex align-items-center gap-2"
            >

                {% csrf_token %}


                <!-- PAGE COURANTE -->

                <input
                    type="hidden"
                    name="next"
                    value="{{ request.get_full_path }}"
                >


                <!-- IDENTIFIANT -->

                <input
                    type="text"
                    name="username"
                    class="form-control form-control-sm"
                    placeholder="Identifiant"
                    autocomplete="username"
                    required
                    style="width: 150px;"
                >


                <!-- MOT DE PASSE -->

                <input
                    type="password"
                    name="password"
                    class="form-control form-control-sm"
                    placeholder="Mot de passe"
                    autocomplete="current-password"
                    required
                    style="width: 150px;"
                >


                <!-- CONNEXION -->

                <button
                    type="submit"
                    class="btn btn-primary btn-sm px-3"
                >
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Connexion
                </button>

            </form>

        {% endif %}

    </div>

</div>
