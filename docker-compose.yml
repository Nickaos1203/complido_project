services:

  web:
    build:
      context: ./Complido
    container_name: complido_web

    environment:
      DB_NAME: complido
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: complido_db

    environment:
      POSTGRES_DB: complido
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d complido"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: